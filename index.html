<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моя Галерея</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">

<style>
body{
margin:0;
padding:20px;
background:black;
font-family:sans-serif;
}

h1{
text-align:center;
color:white;
margin-bottom:30px;
font-weight:300;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
max-width:1000px;
margin:auto;
}

.gallery img{
width:100%;
height:200px;
object-fit:cover;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>ГАЛЕРЕЯ</h1>

<div class="gallery" id="images">

<img src="1.jpg">
<img src="2.jpg">
<img src="3.jpg">
<img src="4.jpg">
<img src="5.jpg">
<img src="6.jpg">
<img src="7.jpg">
<img src="8.jpg">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
<script>
new Viewer(document.getElementById('images'));
</script>

</body>
</html>
